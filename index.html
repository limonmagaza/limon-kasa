<!doctype html>
<html lang="tr"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Limon AI · Limon Çocuk</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f6f5ed;color:#222d22;font:16px system-ui,sans-serif}main{max-width:740px;margin:auto;padding:26px 16px max(32px,env(safe-area-inset-bottom))}header{background:#e9f28d;border-radius:24px;padding:24px;margin-bottom:18px}h1{margin:3px 0;font-size:2.6rem;letter-spacing:-.06em}h2{margin:0 0 14px;font-size:1.25rem}section,details{background:white;border:1px solid #e5e6da;border-radius:20px;padding:18px;margin:12px 0}label{display:block;margin:9px 0;font-weight:600}input,select,textarea,button{font:inherit}input,select,textarea{display:block;width:100%;border:1px solid #bbc4b4;border-radius:10px;padding:10px;margin-top:5px;color:inherit;background:white;min-height:44px}textarea{min-height:85px}button{border:0;border-radius:12px;padding:12px 16px;background:#254431;color:white;min-height:44px;cursor:pointer;margin:5px 5px 5px 0}button.secondary{background:#ecf0e7;color:#254431}button:disabled{opacity:.5}summary{font-weight:650;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 12px}.variant{border:1px solid #dde2d9;border-radius:14px;padding:10px;margin:8px 0}#photos{display:flex;flex-wrap:wrap;gap:8px}.photo{width:95px}.photo img{width:95px;height:112px;object-fit:contain;border-radius:10px}.photo button{width:100%;padding:6px}dialog{width:min(92vw,540px);max-height:84vh;border:0;border-radius:20px;padding:20px;color:inherit}dialog::backdrop{background:#142a1cb0}p{overflow-wrap:anywhere}small{color:#485746}input[type=checkbox]{display:inline;width:24px;min-height:24px;vertical-align:middle;margin:4px}
.sizes{display:flex;flex-wrap:wrap;gap:8px}.sizes button{margin:0;background:#ecf0e7;color:#254431}.sizes button[aria-pressed=true]{background:#f7dc56;color:#26291b;box-shadow:inset 0 0 0 2px #8b7100}.variant{display:grid;grid-template-columns:1fr auto auto;align-items:end;gap:8px}.variant label,.variant button{margin:0}.photo a{display:block;text-align:center;color:#254431}</style>
<main>
<header><strong>LİMON ÇOCUK</strong><h1>Limon AI</h1><small>Ürün taslağı</small></header>
<section><h2>Fotoğraflar</h2><label>Galeriden fotoğraf seç<input id="picker" type="file" accept="image/*"></label><div id="photos"></div><small id="photoNote" role="status">Bir fotoğraf seçin. Kapak ve kare görsel otomatik hazırlanır.</small></section>
<section id="fields"><h2>Ürün bilgileri</h2>
<label>Ürün adı<input name="title" maxlength="100"></label>
<label>Açıklama<textarea name="description"></textarea></label>
<div class="grid"><label>Kız / erkek<select name="gender"><option value="">Seçin</option><option>Kız</option><option>Erkek</option></select></label><label>Renk<input name="color" maxlength="50"></label><label>Kumaş<input name="fabric"></label><label>Satış fiyatı (₺)<input name="price" inputmode="decimal"></label></div></section>
<section><h2>Beden ve stok</h2><div id="sizes" class="sizes" role="group" aria-label="Beden seçin"></div><div id="variants"></div></section>

<section><button id="save">Taslağı kaydet</button><p id="status" role="status" aria-live="polite"></p></section>
</main>

<script>
const byId = id => document.getElementById(id);
const fields = [...document.querySelectorAll('#fields [name]')];
const key = 'current';
const database = new Promise((resolve,reject) => {
  const request = indexedDB.open('limon-ai',1);
  request.onupgradeneeded = () => request.result.createObjectStore('drafts');
  request.onsuccess = () => resolve(request.result);
  request.onerror = () => reject(request.error);
});
let saveVersion = 0;
function readDraft(db) {
  return new Promise((resolve,reject) => {
    const request = db.transaction('drafts').objectStore('drafts').get(key);
    request.onsuccess = () => resolve(request.result);
    request.onerror = () => reject(request.error);
  });
}
const standardSizes = Array.from({length:12}, (_,i) => (i+2)+'-'+(i+3));
function newBarcode() {
  const bytes = crypto.getRandomValues(new Uint8Array(16));
  return 'LC-' + Array.from(bytes, byte => byte.toString(16).padStart(2,'0')).join('');
}
let photos = [], variants = [], pending = false, savedFields = {};
const status = message => { byId('status').textContent = message; };
async function save() {
  if (pending) return status('Fotoğraflar hazırlanıyor. Biraz bekleyin.');
  const version = ++saveVersion;
  const snapshot = { fields:{...savedFields, ...Object.fromEntries(fields.map(f=>[f.name,f.value]))},
    variants:variants.map(v=>({...v})), photos:[...photos] };
  try {
    const db = await database;
    await new Promise((resolve,reject) => {
      const tx = db.transaction('drafts','readwrite');
      tx.oncomplete = resolve;
      tx.onabort = () => reject(tx.error);
      tx.objectStore('drafts').put(snapshot,key);
    });
    if (version === saveVersion) status('Taslak ve fotoğraflar bu cihazda kaydedildi.');
  } catch {
    if (version === saveVersion) status('Taslak kaydedilemedi. Cihazda yer açıp tekrar deneyin.');
  }
}
function renderPhotos() {
  byId('photos').replaceChildren(...photos.map((url,i) => {
    const card = document.createElement('div');
    card.className = 'photo';
    const img = new Image();
    img.src = url;
    img.alt = 'Ürün görseli ' + (i+1);
    const button = document.createElement('button');
    button.className = 'secondary';
    button.textContent = 'Kaldır';
    button.setAttribute('aria-label', img.alt + ' kaldır');
    button.onclick = () => { photos.splice(i,1); renderPhotos(); save(); };
    const download = document.createElement('a');
    download.href = url;
    download.download = 'limon-urun-' + (i + 1) + '.jpg';
    download.textContent = 'İndir';
    card.append(img, download, button);
    return card;
  }));
}
function renderVariants() {
  const sizes = [...new Set([...standardSizes, ...variants.map(v=>v.size)])];
  byId('sizes').replaceChildren(...sizes.map(size => {
    const button = document.createElement('button');
    button.textContent = size;
    const variant = variants.find(v => v.size === size);
    button.setAttribute('aria-pressed', String(Boolean(variant?.selected)));
    button.onclick = () => {
      if (variant) variant.selected = !variant.selected;
      else variants.push({size, barcode:newBarcode(), stock:'1', selected:true});
      renderVariants();
      [...byId('sizes').children].find(b=>b.textContent===size)?.focus();
      save();
    };
    return button;
  }));
  byId('variants').replaceChildren(...variants.filter(v=>v.selected).map(v => {
    const row = document.createElement('div');
    row.className = 'variant';
    const label = document.createElement('label');
    label.textContent = v.size + ' stok adedi';
    const input = document.createElement('input');
    input.value = v.stock;
    input.type = 'number';
    input.min = '0';
    input.max = '999999';
    input.step = '1';
    input.inputMode = 'numeric';
    input.onchange = () => {
      v.stock = String(Math.min(999999, Math.max(0, Math.trunc(input.valueAsNumber || 0))));
      input.value = v.stock;
      save();
    };
    label.append(input);
    const adjust = (step, caption) => {
      const button = document.createElement('button');
      button.className = 'secondary';
      button.textContent = caption;
      button.setAttribute('aria-label', v.size + (step > 0 ? ' stok artır' : ' stok azalt'));
      button.onclick = () => {
        input.value = Math.min(999999, Math.max(0, (Number(v.stock) || 0) + step));
        input.onchange();
      };
      return button;
    };
    row.append(label, adjust(-1, '−'), adjust(1, '+'));
    return row;
  }));
}
function productImage(img, height) {
  const canvas = document.createElement('canvas');
  canvas.width = 1200;
  canvas.height = height;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#fff';
  ctx.fillRect(0, 0, canvas.width, height);
  const ratio = Math.min(canvas.width / img.naturalWidth, height / img.naturalHeight);
  const width = img.naturalWidth * ratio;
  const scaledHeight = img.naturalHeight * ratio;
  ctx.drawImage(img, (canvas.width - width) / 2, (height - scaledHeight) / 2, width, scaledHeight);
  const result = canvas.toDataURL('image/jpeg', 0.88);
  if (!result.startsWith('data:image/jpeg;base64,')) throw Error('JPEG');
  return result;
}
byId('picker').onchange = async event => {
  const input = event.target;
  const file = input.files[0];
  input.value = '';
  if (!file) return;
  pending = true;
  input.disabled = true;
  byId('save').disabled = true;
  const source = URL.createObjectURL(file);
  try {
    const img = new Image();
    img.src = source;
    await img.decode();
    photos = [productImage(img, 1800), productImage(img, 1200)];
    renderPhotos();
    byId('photoNote').textContent = 'Kapak ve kare görsel hazır.';
  } catch {
    byId('photoNote').textContent = 'Fotoğraf açılamadı. JPEG veya PNG olarak tekrar seçin.';
  } finally {
    URL.revokeObjectURL(source);
    pending = false;
    input.disabled = false;
    byId('save').disabled = false;
    await save();
  }
};
async function restore() {
try {
  const saved = await readDraft(await database);
  if (saved) {
    savedFields = saved.fields || {};
    for (const field of fields) field.value = saved.fields?.[field.name] ?? '';
    variants = (saved.variants || []).filter(v=>typeof v.size === 'string' && v.size.trim())
      .map(v=>({size:v.size.trim(), stock:String(v.stock ?? ''), barcode:v.barcode || newBarcode(), selected:v.selected ?? true}));
    photos = saved.photos || [];
    status('Cihazdaki taslak açıldı.');
  }
} catch { status('Cihazdaki taslak okunamadı.'); }
renderVariants();
renderPhotos();
}
const controls = [...document.querySelectorAll('main input, main textarea, main select, main button')];
controls.forEach(control => control.disabled = true);
restore().finally(() => controls.forEach(control => control.disabled = false));
fields.forEach(field => field.oninput = save);
byId('save').onclick = save;
</script>
</html>
